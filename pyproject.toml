[project]
name = "mvocaltoolkit"
version = "0.1.0"
description = "Local API server for automatic phoneme labeling and singing voice dataset tools"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Megageorgio" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6",
    # .7z model archives (many WFL-ASR models are shared that way)
    "py7zr>=0.22",
    # uv manages the isolated environments of the engines
    "uv>=0.6.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mvt = "mvocaltoolkit.cli:main"

[project.urls]
Homepage = "https://github.com/Megageorgio/mVocalToolkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvocaltoolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
