name = "game"
title = "GAME note extractor"
description = "Generative Adaptive MIDI Extractor: notes (MIDI) from singing, robust to noise and reverb; successor of SOME. Runs the official ONNX models."
capabilities = ["midi"]
python = "3.11"
torch = false
size_hint = "~400 MB (onnxruntime with CUDA libraries), models 45-350 MB"
homepage = "https://github.com/openvpi/GAME"
license = "MIT"
requirements = [
    "onnxruntime-gpu[cuda,cudnn]>=1.21; sys_platform != 'darwin'",
    "onnxruntime>=1.21; sys_platform == 'darwin'",
    "numpy",
    "librosa",
    "soundfile",
    "mido",
]

