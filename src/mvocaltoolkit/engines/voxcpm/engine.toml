name = "voxcpm"
title = "VoxCPM2 full and LoRA training"
description = "VoxCPM2 full and LoRA training with frozen input snapshots, optimizer resume and native inference export."
capabilities = ["train", "export"]
python = "3.11"
torch = true
size_hint = "Several GB of optional dependencies; base models are downloaded only when training starts."
homepage = "https://github.com/OpenBMB/VoxCPM"
license = "See source code, selected base model and recording licenses"
requirements = ["torch>=2.7,<2.9", "torchaudio>=2.7,<2.9", "numpy<2", "soundfile", "soxr", "PyYAML", "tqdm", "safetensors", "transformers>=4.57,<5", "einops", "inflect", "addict", "wetext", "modelscope>=1.22", "datasets>=3,<4", "huggingface-hub", "pydantic", "simplejson", "sortedcontainers", "librosa", "matplotlib", "argbind", "tensorboardX", "rich"]

