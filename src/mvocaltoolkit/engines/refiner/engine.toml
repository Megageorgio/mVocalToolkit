python = "3.11"
torch = true
size_hint = "~2.5 GB with CUDA, ~800 MB CPU-only"
homepage = "https://github.com/Megageorgio/mRefinerModel"
license = "MIT"
requirements = [
    "torch",
    "torchaudio",
    "numpy",
    "soundfile",
    "PyYAML",
]

